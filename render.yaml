services:
  - type: web
    name: insightflow-api
    runtime: python
    buildCommand: pip install -r requirements-backend.txt
    startCommand: uvicorn backend.service:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: insightflow-db
          property: connectionString
      - key: INSIGHTFLOW_ADMIN_TOKEN
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://agkau.github.io

databases:
  - name: insightflow-db
    plan: basic-256mb
